[package]
name = "nyx-alpm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Safe Rust wrapper around the system libalpm (ALPM compatibility layer)"
build = "build.rs"

[dependencies]
nyx-core = { path = "../nyx-core" }
thiserror = { workspace = true }

[build-dependencies]
pkg-config = "0.3"
bindgen = { version = "0.72", default-features = false, features = ["runtime", "prettyplease"] }

[dev-dependencies]
tempfile = { workspace = true }
